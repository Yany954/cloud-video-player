# Sign-in, from a wrong password to a kept session to sign-out.
# Needs a development build installed in the simulator, the dev server running
# (pnpm --filter @cvp/mobile start) and a temporary account:
#   maestro test .maestro/sign-in.yaml -e EMAIL=... -e PASSWORD=...
appId: com.cloudvideoplayer.app
---
- runFlow: signed-out.yaml

# The welcome screen: what the app is, and the two ways in.
- assertVisible: Every show you filmed, in one private place.
- assertVisible: Already have an account?
- assertVisible: Privacy policy
- assertVisible: Terms of service
# "Get started" leads to creating an account; the header's back button returns.
- tapOn:
    id: get-started
- extendedWaitUntil:
    visible: Create your account
    timeout: 15000
- tapOn: Back
- extendedWaitUntil:
    visible:
      id: get-started
    timeout: 15000
- tapOn:
    id: go-sign-in
- extendedWaitUntil:
    visible: Use the email address and password of your account.
    timeout: 15000

# A wrong password: same message whether or not the account exists.
- tapOn:
    id: email
- inputText: ${EMAIL}
- tapOn:
    id: password
- inputText: definitely-not-the-password
# The keyboard's return key submits, like pressing the button.
- pressKey: Enter
- extendedWaitUntil:
    visible: Incorrect email or password.
    timeout: 20000

# The right one.
- tapOn:
    id: password
- eraseText: 40
- inputText: ${PASSWORD}
# The keyboard's return key signs in, like pressing the button.
- pressKey: Enter
# iOS offers to keep the password in its own password manager.
- runFlow:
    when:
      visible: Not Now
    commands:
      - tapOn: Not Now
- extendedWaitUntil:
    visible:
      id: tab-videos
    timeout: 20000
# A real API call made with the new session: a new account has no videos.
- extendedWaitUntil:
    visible: No videos yet
    timeout: 20000

# The session survives closing the app.
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: tab-account
    timeout: 30000
- tapOn:
    id: tab-account
- assertVisible: ${EMAIL}
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: get-started
    timeout: 20000
- tapOn:
    id: go-sign-in
- extendedWaitUntil:
    visible: Use the email address and password of your account.
    timeout: 15000

# Creating an account: a password that is too short keeps the button off, and the age and
# terms tick box is asked for before anything is sent.
- tapOn: Create an account
- assertVisible: Create your account
- tapOn:
    id: email
- inputText: nobody-${EMAIL}
- tapOn:
    id: new-password
# iOS offers to invent a password; the test types its own.
- runFlow:
    when:
      visible: Use Strong Password?
    commands:
      - tapOn:
          point: 91%,61%
- inputText: too short
- tapOn: Create your account
- tapOn:
    id: submit
- assertNotVisible: Tick the box to create your account.
- tapOn:
    id: new-password
- inputText: a long enough password
- tapOn: Create your account
- tapOn:
    id: submit
- assertVisible: Tick the box to create your account.
- tapOn:
    id: consent
- tapOn: Sign in
- assertVisible: Use the email address and password of your account.
