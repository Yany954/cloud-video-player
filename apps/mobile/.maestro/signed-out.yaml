# Leaves the app on the welcome screen (signed out), whoever used the simulator last.
appId: com.cloudvideoplayer.app
---
- runFlow: open-app.yaml
- runFlow:
    when:
      visible:
        id: tab-account
    commands:
      - tapOn:
          id: tab-account
      - tapOn:
          id: sign-out
- extendedWaitUntil:
    visible:
      id: get-started
    timeout: 25000
